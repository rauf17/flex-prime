name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build the release package
        run: npm run package
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: FlexPrime-extension
          path: dist/*.zip
