<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #f5f0e8;
      --surface:      #ede8de;
      --surface-2:    #e4ddd0;
      --border:       #d6cfc0;
      --border-hover: #b8b0a0;
      --accent:       #5b4fcf;
      --accent-dim:   rgba(91,79,207,0.1);
      --teal:         #0d9488;
      --teal-dim:     rgba(13,148,136,0.1);
      --amber:        #b45309;
      --amber-dim:    rgba(180,83,9,0.08);
      --violet:       #7c3aed;
      --violet-dim:   rgba(124,58,237,0.08);
      --text:         #2c2820;
      --text-2:       #5a5040;
      --text-3:       #6a5e4b;
      --danger:       #dc2626;
      --green:        #059669;
      --r:            8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* One menu, no scrolling */
    html, body { overflow: hidden; }
    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
    }

    .wrap { padding: 12px; display: flex; flex-direction: column; gap: 7px; }

    /* ── HEADER ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 9px; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-icon {
      width: 30px; height: 30px; background: var(--accent-dim);
      border: 1px solid rgba(91,79,207,0.2); border-radius: 9px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-icon svg { width: 16px; height: 16px; }
    .brand-text { display: flex; flex-direction: column; gap: 1px; }
    .brand-name { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; line-height: 1; }
    .brand-name span { color: var(--accent); }
    .brand-sub { font-size: 9.5px; color: var(--text-3); margin-top: 2px; }
    .v-chip {
      font-size: 10px; font-weight: 600; color: var(--text-2); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── SECTION LABEL ── */
    .sec {
      font-size: 9.5px; font-weight: 600; color: var(--text-3);
      letter-spacing: 0.6px; text-transform: uppercase; margin-top: 2px;
    }

    /* ── UPDATE BANNER ── */
    .update-banner {
      display: none; align-items: center; gap: 8px; padding: 7px 10px;
      border-radius: var(--r); font-size: 11px; font-weight: 600;
      background: var(--teal-dim); border: 1px solid var(--teal); color: #0b5f58;
    }
    .update-banner.show { display: flex; }
    .update-banner span { flex: 1; }
    .update-banner a {
      color: #fff; background: #0f766e; text-decoration: none;
      padding: 4px 9px; border-radius: 6px; font-weight: 700; font-size: 10.5px;
    }

    /* ── WHAT'S NEW ── */
    .whats-new {
      display: none; align-items: flex-start; gap: 8px; padding: 7px 10px;
      border-radius: var(--r); font-size: 11px; line-height: 1.35;
      background: var(--accent-dim); border: 1px solid var(--accent); color: #3b3399;
    }
    .whats-new.show { display: flex; }
    .whats-new span { flex: 1; }
    .whats-new button {
      background: none; border: 0; color: inherit; cursor: pointer; font-size: 12px; line-height: 1; padding: 2px 4px;
    }

    /* ── TOOLS: 2 x 2 grid ── */
    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tool {
      display: flex; align-items: center; gap: 8px; text-align: left;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 8px 9px; cursor: pointer; min-width: 0;
      transition: background 0.15s, border-color 0.15s; font-family: inherit;
    }
    .tool:hover { background: var(--surface-2); border-color: var(--border-hover); }
    .tool:active { transform: scale(0.98); }
    .tool-icon {
      width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .tool-icon svg { width: 14px; height: 14px; }
    .tool-icon.c-purple { background: var(--accent-dim); }
    .tool-icon.c-teal   { background: var(--teal-dim); }
    .tool-icon.c-amber  { background: var(--amber-dim); }
    .tool-body { min-width: 0; }
    .tool-title { font-size: 11.5px; font-weight: 600; color: var(--text); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool-hint { font-size: 9.5px; color: var(--text-3); margin-top: 1px; font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── ALERT SWITCHES: one row ── */
    .alerts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .chip {
      display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
      padding: 7px 4px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); font-size: 11px; font-weight: 500; color: var(--text-2);
      user-select: none;
    }
    .chip input { accent-color: var(--teal); width: 13px; height: 13px; cursor: pointer; }
    .chip:has(input:checked) { border-color: var(--teal); background: var(--teal-dim); color: var(--text); }

    /* ── THEME PILLS ── */
    .theme-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .theme-opt, .fb-opt { display: none; }
    .theme-label {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 4px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); cursor: pointer; font-size: 11px; color: var(--text-2); font-weight: 500;
      transition: border-color 0.15s, background 0.15s;
    }
    .theme-label:hover { border-color: var(--border-hover); }
    .theme-swatch { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    #t-light:checked + .theme-label { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
    #t-dark:checked  + .theme-label { border-color: #3b82f6; background: rgba(59,130,246,0.08); color: var(--text); }
    #t-nord:checked  + .theme-label { border-color: var(--teal); background: var(--teal-dim); color: var(--text); }

    /* ── FEEDBACK: 3 x 2 text pills + button ── */
    .fb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .fb-label {
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 6px 3px; min-height: 30px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); cursor: pointer; font-size: 10.5px; color: var(--text-2); font-weight: 500;
      line-height: 1.2; transition: border-color 0.15s, background 0.15s;
    }
    .fb-label:hover { border-color: var(--border-hover); }
    .fb-opt:checked + .fb-label { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
    #fb-rand:checked + .fb-label { border-color: var(--teal); background: var(--teal-dim); }

    .btn-submit {
      width: 100%; padding: 7px 12px; background: var(--accent); border: 1px solid var(--accent);
      border-radius: var(--r); color: #fff; font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: opacity 0.15s;
    }
    .btn-submit svg { width: 12px; height: 12px; flex-shrink: 0; }
    .btn-submit:hover { opacity: 0.9; }

    /* ── FOOTER ── */
    footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 8px; border-top: 1px solid var(--border);
    }
    .footer-left { font-size: 10.5px; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
    .footer-left a { color: var(--text-2); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 3px; }
    .footer-left a:hover { color: var(--accent); }
    .footer-left svg { width: 11px; height: 11px; }
    .hb { color: #be123c; display: inline-block; animation: hb 1.6s infinite; font-style: normal; }
    @keyframes hb { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    .footer-right { font-size: 9.5px; color: var(--text-3); font-weight: 500; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 10px; left: 12px; right: 12px; background: #2c2820;
      border: 1px solid #4a4030; border-radius: var(--r); padding: 8px 12px; font-size: 11.5px;
      color: #2dd4bf; display: flex; align-items: center; gap: 8px;
      transform: translateY(60px); opacity: 0;
      transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); z-index: 999;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { color: #f87171; }
    .toast svg { width: 13px; height: 13px; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5b4fcf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Flex <span>Prime</span></div>
        <div class="brand-sub">FAST-NUCES Student Toolkit</div>
      </div>
    </div>
    <div class="v-chip">Ragra</div>
  </header>

  <!-- UPDATE BANNER (shown only when a newer version is on GitHub) -->
  <div class="update-banner" id="update-banner">
    <span id="update-text">A new version is available</span>
    <a id="update-link" href="https://github.com/rauf17/flex-prime/releases/latest" target="_blank" rel="noopener">Download</a>
  </div>

  <!-- WHAT'S NEW (shown once after an update) -->
  <div class="whats-new" id="whats-new" role="status">
    <span id="whats-new-text"></span>
    <button id="whats-new-close" type="button" aria-label="Dismiss what's new">&#10005;</button>
  </div>

  <!-- TOOLS -->
  <div class="sec">Tools</div>
  <div class="tools">
    <button class="tool" id="btn-marks" type="button">
      <div class="tool-icon c-purple">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5b4fcf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="12" width="4" height="9"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="3" width="4" height="18"/>
        </svg>
      </div>
      <div class="tool-body">
        <div class="tool-title">Fix Grand Total</div>
        <div class="tool-hint">Ctrl+Shift+F</div>
      </div>
    </button>

    <button class="tool" id="btn-gpa" type="button">
      <div class="tool-icon c-teal">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div class="tool-body">
        <div class="tool-title">GPA Calculator</div>
        <div class="tool-hint">Ctrl+Shift+S</div>
      </div>
    </button>

    <button class="tool" id="btn-pdf" type="button">
      <div class="tool-icon c-amber">
        <svg viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <div class="tool-body">
        <div class="tool-title">Export Transcript</div>
        <div class="tool-hint">Transcript page</div>
      </div>
    </button>

    <button class="tool" id="btn-summary" type="button">
      <div class="tool-icon c-teal">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      </div>
      <div class="tool-body">
        <div class="tool-title">All Semesters</div>
        <div class="tool-hint">Marks summary</div>
      </div>
    </button>
  </div>

  <!-- ALERTS -->
  <div class="sec">Alerts</div>
  <div class="alerts">
    <label class="chip" title="Notify me when new marks are added"><input type="checkbox" id="alerts-toggle" checked> Marks</label>
    <label class="chip" title="Notify me when attendance drops below 80%"><input type="checkbox" id="att-toggle" checked> Attendance</label>
    <label class="chip" title="Remind me before a fee challan is due"><input type="checkbox" id="fee-toggle" checked> Fees</label>
  </div>

  <!-- THEME -->
  <div class="sec">Theme</div>
  <div class="theme-row">
    <input type="radio" name="theme-radio" id="t-dark" value="dark" class="theme-opt">
    <label for="t-dark" class="theme-label">
      <span class="theme-swatch" style="background:#0a0e1a; border:1px solid #3b82f6;"></span>Midnight
    </label>
    <input type="radio" name="theme-radio" id="t-light" value="light" class="theme-opt">
    <label for="t-light" class="theme-label">
      <span class="theme-swatch" style="background:#f0f4f8; border:1px solid #94a3b8;"></span>Classic
    </label>
    <input type="radio" name="theme-radio" id="t-nord" value="nord" class="theme-opt">
    <label for="t-nord" class="theme-label">
      <span class="theme-swatch" style="background:#2e3440; border:1px solid #88c0d0;"></span>Nordic
    </label>
  </div>

  <!-- FEEDBACK -->
  <div class="sec">Feedback Autofill</div>
  <div class="fb-grid">
    <input type="radio" name="feedback-radio" id="fb-sa" value="Strongly Agree" class="fb-opt">
    <label for="fb-sa" class="fb-label">Strongly Agree</label>
    <input type="radio" name="feedback-radio" id="fb-a" value="Agree" class="fb-opt">
    <label for="fb-a" class="fb-label">Agree</label>
    <input type="radio" name="feedback-radio" id="fb-u" value="Uncertain" class="fb-opt">
    <label for="fb-u" class="fb-label">Uncertain</label>
    <input type="radio" name="feedback-radio" id="fb-d" value="Dissatisfied" class="fb-opt">
    <label for="fb-d" class="fb-label">Dissatisfied</label>
    <input type="radio" name="feedback-radio" id="fb-sd" value="Strongly Disagree" class="fb-opt">
    <label for="fb-sd" class="fb-label">Strongly Disagree</label>
    <input type="radio" name="feedback-radio" id="fb-rand" value="Randomize" class="fb-opt">
    <label for="fb-rand" class="fb-label">Random</label>
  </div>
  <button class="btn-submit" id="btn-feedback" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    Autofill Feedback
  </button>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">
      Made with <span class="hb">♥</span> by
      <a href="https://github.com/rauf17" target="_blank">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.216.69.825.572C20.565 21.795 24 17.298 24 12c0-6.63-5.37-12-12-12z"/></svg>
        Abdul Rauf
      </a>
    </div>
    <div class="footer-right">FAST-NUCES ISB</div>
  </footer>

</div>

<div class="toast" id="toast">
  <svg id="toast-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  <span id="toast-msg">Done!</span>
</div>

<script src="injected.js"></script>
<script src="popup.js"></script>
</body>
</html>
