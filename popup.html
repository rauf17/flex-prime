<!doctype html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #f5f0e8;
      --surface:      #ede8de;
      --surface-2:    #e4ddd0;
      --border:       #d6cfc0;
      --border-hover: #b8b0a0;
      --accent:       #5b4fcf;
      --accent-dim:   rgba(91,79,207,0.1);
      --teal:         #0d9488;
      --teal-dim:     rgba(13,148,136,0.1);
      --amber:        #b45309;
      --amber-dim:    rgba(180,83,9,0.08);
      --violet:       #7c3aed;
      --violet-dim:   rgba(124,58,237,0.08);
      --text:         #2c2820;
      --text-2:       #6b6050;
      --text-3:       #9c8e7a;
      --danger:       #dc2626;
      --green:        #059669;
      --r:            8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .wrap {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .brand-icon {
      width: 34px; height: 34px;
      background: var(--accent-dim);
      border: 1px solid rgba(91,79,207,0.2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand-icon svg { width: 17px; height: 17px; }

    .brand-text { display: flex; flex-direction: column; gap: 1px; }
    .brand-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      line-height: 1;
    }
    .brand-name span { color: var(--accent); }
    .brand-sub {
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: 0.2px;
      margin-top: 2px;
    }

    .v-chip {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-3);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 7px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── SECTION LABEL ── */
    .sec {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-top: 8px;
      margin-bottom: 2px;
    }

    /* ── ACTION ROW ── */
    .action {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 9px 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      width: 100%;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .action:hover { background: var(--surface-2); border-color: var(--border-hover); }
    .action:active { transform: scale(0.99); }

    .action::before {
      content: '';
      position: absolute;
      left: 0; top: 18%; bottom: 18%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .action:hover::before { opacity: 1; }
    .action.c-purple::before { background: var(--accent); }
    .action.c-teal::before   { background: var(--teal); }
    .action.c-amber::before  { background: var(--amber); }
    .action.c-violet::before { background: var(--violet); }

    .action-icon {
      width: 30px; height: 30px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .action-icon svg { width: 15px; height: 15px; }
    .action-icon.c-purple { background: var(--accent-dim); }
    .action-icon.c-teal   { background: var(--teal-dim); }
    .action-icon.c-amber  { background: var(--amber-dim); }
    .action-icon.c-violet { background: var(--violet-dim); }

    .action-body { flex: 1; min-width: 0; }
    .action-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }
    .action-hint {
      font-size: 10.5px;
      color: var(--text-3);
      margin-top: 1px;
      font-family: 'JetBrains Mono', monospace;
    }

    .action-arrow { color: var(--text-3); flex-shrink: 0; }
    .action-arrow svg { width: 14px; height: 14px; }

    /* ── THEME SWITCHER ── */
    .theme-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
    }
    .theme-opt { display: none; }
    .theme-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 4px 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 11px;
      color: var(--text-2);
      font-weight: 500;
    }
    .theme-label:hover { border-color: var(--border-hover); }
    .theme-swatch { width: 22px; height: 14px; border-radius: 4px; }
    #t-light:checked + .theme-label { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
    #t-dark:checked  + .theme-label { border-color: #3b82f6; background: rgba(59,130,246,0.08); color: var(--text); }
    #t-nord:checked  + .theme-label { border-color: var(--teal); background: var(--teal-dim); color: var(--text); }

    /* ── FEEDBACK GRID ── */
    .fb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .fb-opt { display: none; }
    .fb-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 7px 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 10px;
      color: var(--text-2);
      font-weight: 500;
      text-align: center;
      line-height: 1.3;
    }
    .fb-label:hover { border-color: var(--border-hover); }
    .fb-label svg { width: 15px; height: 15px; }
    .fb-opt:checked + .fb-label { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
    #fb-rand:checked + .fb-label { border-color: var(--teal); background: var(--teal-dim); }

    /* ── SUBMIT BUTTON ── */
    .btn-submit {
      width: 100%;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text-2);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-submit svg { width: 13px; height: 13px; flex-shrink: 0; }
    .btn-submit:hover { background: var(--surface-2); border-color: var(--border-hover); color: var(--text); }

    /* ── FOOTER ── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      margin-top: 6px;
      border-top: 1px solid var(--border);
    }
    .footer-left { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
    .footer-left a {
      color: var(--text-2);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: color 0.15s;
    }
    .footer-left a:hover { color: var(--accent); }
    .footer-left svg { width: 11px; height: 11px; }
    .hb { color: #e11d48; display: inline-block; animation: hb 1.6s infinite; font-style: normal; }
    @keyframes hb { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    .footer-right { font-size: 10px; color: var(--text-3); font-weight: 500; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 12px; left: 12px; right: 12px;
      background: #2c2820;
      border: 1px solid #4a4030;
      border-radius: var(--r);
      padding: 9px 13px;
      font-size: 12px;
      color: #2dd4bf;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateY(60px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 999;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { color: #f87171; }
    .toast svg { width: 13px; height: 13px; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5b4fcf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Flex <span>Prime</span></div>
        <div class="brand-sub">FAST-NUCES Student Toolkit</div>
      </div>
    </div>
    <div class="v-chip">Ragra</div>
  </header>

  <!-- QUICK ACTIONS -->
  <div class="sec">Actions</div>

  <button class="action c-purple" id="btn-marks" type="button">
    <div class="action-icon c-purple">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5b4fcf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="12" width="4" height="9"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="3" width="4" height="18"/>
      </svg>
    </div>
    <div class="action-body">
      <div class="action-title">Fix Grand Total</div>
      <div class="action-hint">Ctrl+Shift+F</div>
    </div>
    <div class="action-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
  </button>

  <button class="action c-teal" id="btn-gpa" type="button">
    <div class="action-icon c-teal">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <div class="action-body">
      <div class="action-title">GPA Calculator</div>
      <div class="action-hint">Ctrl+Shift+S</div>
    </div>
    <div class="action-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
  </button>

  <button class="action c-amber" id="btn-pdf" type="button">
    <div class="action-icon c-amber">
      <svg viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
    </div>
    <div class="action-body">
      <div class="action-title">Export Transcript</div>
      <div class="action-hint">Transcript page only</div>
    </div>
    <div class="action-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
  </button>


  <!-- THEME -->
  <div class="sec">Theme</div>
  <div class="theme-row">
    <input type="radio" name="theme-radio" id="t-light" value="light" class="theme-opt">
    <label for="t-light" class="theme-label">
      <div class="theme-swatch" style="background:#f0f4f8; border:1px solid #cbd5e1;"></div>
      Classic
    </label>

    <input type="radio" name="theme-radio" id="t-dark" value="dark" class="theme-opt">
    <label for="t-dark" class="theme-label">
      <div class="theme-swatch" style="background:#0a0e1a; border:1px solid #1e2d4a;"></div>
      Midnight
    </label>

    <input type="radio" name="theme-radio" id="t-nord" value="nord" class="theme-opt">
    <label for="t-nord" class="theme-label">
      <div class="theme-swatch" style="background:#2e3440; border:1px solid #4c566a;"></div>
      Nordic
    </label>
  </div>

  <!-- FEEDBACK -->
  <div class="sec">Feedback Autofill</div>
  <div class="fb-grid">
    <input type="radio" name="feedback-radio" id="fb-sa" value="Strongly Agree" class="fb-opt">
    <label for="fb-sa" class="fb-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
      Strongly Agree
    </label>

    <input type="radio" name="feedback-radio" id="fb-a" value="Agree" class="fb-opt">
    <label for="fb-a" class="fb-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M9 13s1 1.5 3 1.5 3-1.5 3-1.5"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
      Agree
    </label>

    <input type="radio" name="feedback-radio" id="fb-u" value="Uncertain" class="fb-opt">
    <label for="fb-u" class="fb-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="8" y1="13" x2="16" y2="13"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
      Uncertain
    </label>

    <input type="radio" name="feedback-radio" id="fb-d" value="Dissatisfied" class="fb-opt">
    <label for="fb-d" class="fb-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M9 15s1-1.5 3-1.5 3 1.5 3 1.5"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
      Dissatisfied
    </label>

    <input type="radio" name="feedback-radio" id="fb-sd" value="Strongly Disagree" class="fb-opt">
    <label for="fb-sd" class="fb-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M9 15s1.5-2.5 3-2.5 3 2.5 3 2.5"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
      Strongly Disagree
    </label>

    <input type="radio" name="feedback-radio" id="fb-rand" value="Randomize" class="fb-opt">
    <label for="fb-rand" class="fb-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
        <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
      </svg>
      Random
    </label>
  </div>

  <button class="btn-submit" id="btn-feedback" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    Autofill Feedback
  </button>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">
      Made with <span class="hb">♥</span> by
      <a href="https://github.com/rauf17" target="_blank">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.216.69.825.572C20.565 21.795 24 17.298 24 12c0-6.63-5.37-12-12-12z"/></svg>
        Abdul Rauf
      </a>
    </div>
    <div class="footer-right">FAST-NUCES ISB</div>
  </footer>

</div>

<div class="toast" id="toast">
  <svg id="toast-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  <span id="toast-msg">Done!</span>
</div>

<script src="popup.js"></script>
</body>
</html>
